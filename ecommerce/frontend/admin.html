<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — TechStore</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===================== NAVBAR ===================== -->
    <nav class="navbar">
      <div class="container">
        <div class="logo">Tech<span class="accent">Store</span></div>

        <div class="search-bar">
          <input type="text" placeholder="Admin Panel" disabled />
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          &#9776;
        </button>

        <div class="nav-links" id="navLinks">
          <a href="index.html">Home</a>

          <a href="admin.html" class="active">Admin</a>
          <a href="cart.html" class="cart-link">
            &#128722; Cart
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- ===================== ADMIN CONTENT ===================== -->
    <main class="container admin-page">
      <div class="admin-header">
        <div>
          <h1>Admin Panel</h1>
          <p class="subtitle">
            Add, update, and delete products in the TechStore catalog.
          </p>
        </div>
      </div>

      <div class="admin-layout">
        <!-- ===== Add / Edit Product Form ===== -->
        <div class="admin-form-card">
          <h3 id="formTitle">Add New Product</h3>

          <form id="productForm">
            <!-- Hidden field to track which product is being edited (empty = creating new) -->
            <input type="hidden" id="productId" />

            <div class="form-group">
              <label for="name">Product Name</label>
              <input
                type="text"
                id="name"
                placeholder="e.g. iPhone 15"
                required
              />
            </div>

            <div class="form-group">
              <label for="price">Price (₹)</label>
              <input
                type="number"
                id="price"
                placeholder="e.g. 79999"
                min="0"
                step="0.01"
                required
              />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">Select category</option>
                <option value="Mobiles">Mobiles</option>
                <option value="Laptops">Laptops</option>
                <option value="Tablets">Tablets</option>
                <option value="Wearables">Wearables</option>
                <option value="Accessories">Accessories</option>
                <option value="Electronics">Electronics</option>
              </select>
            </div>

            <div class="form-group">
              <label for="image">Image URL</label>
              <input type="url" id="image" placeholder="https://..." required />
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea
                id="description"
                placeholder="Short product description..."
                required
              ></textarea>
            </div>

            <div class="form-actions">
              <button
                type="submit"
                class="btn btn-primary btn-block"
                id="submitBtn"
              >
                Add Product
              </button>
              <button
                type="button"
                class="btn btn-outline"
                id="cancelEditBtn"
                style="display: none"
              >
                Cancel
              </button>
            </div>

            <div class="form-message" id="formMessage"></div>
          </form>
        </div>

        <!-- ===== Product List Table ===== -->
        <div class="admin-table-card">
          <h3>
            All Products
            <span
              style="
                color: var(--text-dim);
                font-family: var(--font-mono);
                font-size: 0.8rem;
              "
              id="adminCount"
            ></span>
          </h3>
          <div style="overflow-x: auto">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Image</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="adminTableBody">
                <tr>
                  <td
                    colspan="5"
                    style="
                      text-align: center;
                      color: var(--text-dim);
                      padding: 24px;
                    "
                  >
                    Loading products...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer>
      Built with <span class="accent">Node.js</span>,
      <span class="accent">Express</span> &amp;
      <span class="accent">MongoDB</span> — TechStore Demo Project
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
