<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart — TechStore</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===================== NAVBAR ===================== -->
    <nav class="navbar">
      <div class="container">
        <div class="logo">Tech<span class="accent">Store</span></div>

        <div class="search-bar">
          <span class="icon">&#128269;</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search phones, laptops, accessories..."
            disabled
          />
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          &#9776;
        </button>

        <div class="nav-links" id="navLinks">
          <a href="index.html">Home</a>

          <a href="admin.html">Admin</a>
          <a href="cart.html" class="cart-link">
            &#128722; Cart
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- ===================== CART CONTENT ===================== -->
    <main class="container cart-page">
      <h1>Your Cart</h1>
      <p class="subtitle">
        Review your items, adjust quantities, and check out.
      </p>

      <div class="cart-layout" id="cartLayout">
        <!-- Populated by js/cart-page.js -->
      </div>
    </main>

    <footer>
      Built with <span class="accent">Node.js</span>,
      <span class="accent">Express</span> &amp;
      <span class="accent">MongoDB</span> — TechStore Demo Project
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-page.js"></script>
  </body>
</html>
