<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore — Electronics, sorted.</title>

    <!-- Google Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (specs/prices) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===================== NAVBAR ===================== -->
    <nav class="navbar">
      <div class="container">
        <div class="logo">Tech<span class="accent">Store</span></div>

        <div class="search-bar">
          <span class="icon">&#128269;</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search phones, laptops, accessories..."
          />
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          &#9776;
        </button>

        <div class="nav-links" id="navLinks">
          <a href="index.html" class="active">Home</a>

          <a href="admin.html">Admin</a>
          <a href="cart.html" class="cart-link">
            &#128722; Cart
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- ===================== HERO ===================== -->
    <header class="hero">
      <div class="container">
        <span class="hero-eyebrow">// electronics, sorted</span>
        <h1>Find the right device. Skip the noise.</h1>
        <p>
          Curated phones, laptops, wearables and accessories — with specs that
          matter, prices that don't hide anything.
        </p>
      </div>
    </header>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="container">
      <!-- Category filter pills, generated dynamically from product data -->
      <div class="category-bar" id="categoryBar">
        <button class="category-pill active" data-category="All">All</button>
      </div>

      <h2 class="section-title">
        Products <span class="count" id="resultCount"></span>
      </h2>

      <div class="product-grid" id="productGrid">
        <div class="loading-state">
          <div class="spinner"></div>
          Loading products...
        </div>
      </div>
    </main>

    <footer style="color: rgb(239, 239, 249)">
      2026 Deepika Rakoti. All rights reserved.
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
